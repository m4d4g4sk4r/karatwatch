name: CI
on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secrets:
    name: Gitleaks full history
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan all fetched history with Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --config /repo/.gitleaks.toml --log-opts="--all" --redact --no-banner
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m compileall -q backend
      - run: python -m pytest tests -v
        working-directory: backend
  files:
    name: Widget and publication checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --input-type=module --check < frontend/KaratWatch.js
      - run: python3 scripts/check_publication.py
      - run: git diff --check
  docker:
    name: Docker build and health check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - run: cp .env.example backend/.env
      - run: docker compose -f backend/docker-compose.yml config --quiet
      - run: docker build -t karatwatch-ci backend
      - name: Check container startup without fetching upstream prices
        run: |
          docker run -d --name karatwatch-ci -e HOST=0.0.0.0 -p 127.0.0.1:18765:8765 karatwatch-ci
          curl --fail --retry 10 --retry-connrefused --retry-all-errors --retry-delay 2 http://127.0.0.1:18765/health
      - if: always()
        run: |
          docker logs karatwatch-ci || true
          docker rm -f karatwatch-ci || true
