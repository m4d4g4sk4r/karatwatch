version: '3.8'

services:
  metals-api:
    build: .
    container_name: precious-metals-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ./data:/data
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - CACHE_FILE=/data/cache.json
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://127.0.0.1:8765/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: precious-metals-network
    driver: bridge